<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo app</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="container">
      <div class="status-bar">
        <div class="details">
          <h2>Todo App</h2>
          <p>Keep it up!</p>
        </div>
        <div class="numbers"><h2>1/3</h2></div>
      </div>
      <div class="task">
        <div class="input-bar">
          <form>
            <input id="input" type="text" placeholder="Write your task" />
            <button id="button" type="submit" onclick="createLink()">+</button>
          </form>
        </div>
      </div>
      <ul id="todolist">
        
      </ul>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
